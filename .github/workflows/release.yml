name: Exact artifact release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftline-release
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && vars.LIFTLINE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETA_ACCOUNT: ${{ secrets.BETA_ACCOUNT }}
      PROD_ACCOUNT: ${{ secrets.PROD_ACCOUNT }}
      BETA_ALERT_EMAIL: ${{ secrets.BETA_ALERT_EMAIL }}
      PROD_ALERT_EMAIL: ${{ secrets.PROD_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/check-release-config.ts
      - run: pip install -r requirements-test.txt
      - run: python scripts/local-aws.py > /tmp/moto.log 2>&1 &
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm manifest
      - run: node --import tsx scripts/candidate-archive.ts pack
        env:
          CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          path: candidate.enc
          retention-days: 14
  beta:
    needs: candidate
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: beta
    secrets: inherit
    permissions:
      contents: read
  prod:
    if: vars.LIFTLINE_PROD_RELEASE_ENABLED == 'true'
    needs: beta
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
    secrets: inherit
    permissions:
      contents: read
