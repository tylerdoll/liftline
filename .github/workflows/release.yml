name: Exact artifact release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: liftline-release
  cancel-in-progress: false
jobs:
  candidate:
    if: vars.LIFTLINE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pip install -r requirements-test.txt
      - run: python scripts/local-aws.py > /tmp/moto.log 2>&1 &
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
        env:
          PREPROD_ACCOUNT: ${{ vars.PREPROD_ACCOUNT }}
          PROD_ACCOUNT: ${{ vars.PROD_ACCOUNT }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      - run: pnpm manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          path: |
            dist
            cdk.out
            release/manifest.json
          retention-days: 90
  preprod:
    needs: candidate
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: preprod
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  prod:
    needs: preprod
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
    secrets: inherit
    permissions:
      contents: read
      id-token: write
